<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><rect width="1600" height="1100" fill="#f4f5f7"/><g font-family="Arial, Helvetica, sans-serif"><text x="64" y="52" font-size="13" fill="#747b85" font-weight="600">RENDER FARM / PRODUCT GUIDE</text><text x="64" y="105" font-size="36" fill="#22262b" font-weight="600">Match the queue to your workstation</text><text x="64" y="140" font-size="18" fill="#656d78" font-weight="400">Control parallel tasks and retry limits from one set of preferences.</text><rect x="64" y="178" width="1472" height="746" rx="14" fill="#fff" stroke="#dfe2e6"/><rect x="88" y="199" width="32" height="32" rx="7" fill="#25282c" stroke="#25282c"/><rect x="96" y="208" width="3" height="14" rx="1" fill="#fff" stroke="#fff"/><rect x="102" y="206" width="3" height="16" rx="1" fill="#fff" stroke="#fff"/><rect x="108" y="204" width="3" height="18" rx="1" fill="#fff" stroke="#fff"/><text x="132" y="222" font-size="22" fill="#26292d" font-weight="600">Render Farm</text><text x="88" y="958" font-size="13" fill="#838a94" font-weight="400">Illustrated interface · Example project</text><path d="M64 250h1472" stroke="#e6e8eb"/><text x="102" y="300" font-size="26" fill="#30353d" font-weight="600">Preferences</text><path d="M64 327h1472" stroke="#e6e8eb"/><text x="111" y="381" font-size="17" fill="#69737e" font-weight="400">Defaults</text><rect x="88" y="415" width="246" height="44" rx="7" fill="#eaf0f7" stroke="none"/><text x="111" y="443" font-size="17" fill="#3a658b" font-weight="600">Processing</text><text x="111" y="505" font-size="17" fill="#69737e" font-weight="400">On completion</text><text x="111" y="567" font-size="17" fill="#69737e" font-weight="400">Applications</text><text x="111" y="629" font-size="17" fill="#69737e" font-weight="400">Lock</text><text x="111" y="691" font-size="17" fill="#69737e" font-weight="400">Advanced</text><path d="M360 328v596" stroke="#e5e9ee"/><text x="402" y="384" font-size="23" fill="#303741" font-weight="600">Processing</text><text x="402" y="433" font-size="18" fill="#343c46" font-weight="600">Parallel rendering</text><text x="402" y="464" font-size="16" fill="#76818d" font-weight="400">Run more than one render task at a time.</text><text x="402" y="489" font-size="16" fill="#76818d" font-weight="400">Allow for each task’s memory use and any license limits.</text><rect x="1404" y="421" width="48" height="27" rx="14" fill="#3f705c" stroke="none"/><rect x="1427" y="424" width="21" height="21" rx="11" fill="#fff" stroke="none"/><rect x="402" y="512" width="70" height="40" rx="10" fill="#fff" stroke="#dfe2e6"/><text x="426" y="539" font-size="18" fill="#24272b" font-weight="400">2</text><text x="489" y="539" font-size="16" fill="#7c8793" font-weight="400">concurrent tasks</text><path d="M402 577h1050" stroke="#e6e8eb"/><text x="402" y="620" font-size="16" fill="#41464d" font-weight="550">Threads per task</text><rect x="402" y="633" width="220" height="40" rx="10" fill="#fff" stroke="#dfe2e6"/><text x="415" y="659" font-size="17" fill="#24272b" font-weight="400">0</text><text x="402" y="698" font-size="14" fill="#777e87" font-weight="400">0 assigns CPU threads automatically.</text><text x="943" y="620" font-size="16" fill="#41464d" font-weight="550">Retry failed frames</text><rect x="943" y="633" width="220" height="40" rx="10" fill="#fff" stroke="#dfe2e6"/><text x="956" y="659" font-size="17" fill="#24272b" font-weight="400">2</text><text x="943" y="698" font-size="14" fill="#777e87" font-weight="400">Retries missing frames after a render stops.</text><path d="M402 727h1050" stroke="#e6e8eb"/><text x="402" y="768" font-size="16" fill="#41464d" font-weight="550">Arnold log level</text><rect x="402" y="781" width="760" height="40" rx="10" fill="#fff" stroke="#dfe2e6"/><text x="415" y="807" font-size="17" fill="#24272b" font-weight="400">Info (shows progress)</text><path d="M64 855h1472" stroke="#e6e8eb"/><text x="402" y="895" font-size="16" fill="#7a8591" font-weight="400">Processing settings apply to the queue.</text><rect x="1330" y="873" width="122" height="38" rx="7" fill="#25282c" stroke="#dfe2e6"/><text x="1344" y="898" font-size="16" fill="#fff" font-weight="550">Done</text><text x="64" y="1004" font-size="18" fill="#30363d" font-weight="600">Parallel tasks</text><text x="64" y="1036" font-size="15" fill="#6d7580" font-weight="400">Balance throughput against memory use.</text><text x="564" y="1004" font-size="18" fill="#30363d" font-weight="600">Automatic threads</text><text x="564" y="1036" font-size="15" fill="#6d7580" font-weight="400">Share available CPU cores across tasks.</text><text x="1064" y="1004" font-size="18" fill="#30363d" font-weight="600">Frame retries</text><text x="1064" y="1036" font-size="15" fill="#6d7580" font-weight="400">Retry missing output within your chosen limit.</text></g></svg>