name: Validate and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --import tsx --test test/platform.test.ts test/runner.test.ts
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: render-farm-windows
          path: dist/Render-Farm-*-Windows-*.exe
          if-no-files-found: error

  mac:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dist:mac
      - run: node scripts/verify-mac.cjs dist/Render-Farm-*-macOS-*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: render-farm-macos
          path: dist/Render-Farm-*-macOS-*.zip
          if-no-files-found: error
