name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win nsis portable --x64 --publish never
      - name: Attach files to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          gh release upload "$TAG" \
            "dist/RenderFarm-Setup-${version}.exe" \
            "dist/RenderFarm-Portable-${version}.exe" \
            --clobber
          if [ -f "docs/releases/${TAG}.md" ]; then
            gh release edit "$TAG" --title "Render Farm ${version}" --notes-file "docs/releases/${TAG}.md"
          fi
