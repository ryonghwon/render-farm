appId: kr.ac.kaywon.renderfarm
productName: Render Farm
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - build/icon.png
  - package.json
asarUnpack:
  - build/icon.png
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Render Farm
  artifactName: Render-Farm-${version}-Windows-${arch}-Setup.${ext}
portable:
  artifactName: Render-Farm-${version}-Windows-${arch}-Portable.${ext}
mac:
  target:
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.graphics-design
  icon: build/icon.png
  identity: '-'
  hardenedRuntime: false
  artifactName: Render-Farm-${version}-macOS-${arch}.${ext}
  extendInfo:
    NSAppleEventsUsageDescription: Allows Render Farm to shut down this Mac after the render queue completes, when you select Shut down.
    CFBundleDisplayName: Render Farm
linux:
  target: AppImage
publish: null
